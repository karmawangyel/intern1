<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hello</title>
  </head>

  <body>
    <h1 class="hp">Hi, This is karma</h1>
    <button>Hide</button>
    <button class="btn">Show</button>

    <script>
      document.querySelector("button").addEventListener("click", function abc() {
        document.querySelector(".hp").style.display = "none";
      });
      document.querySelector(".btn").addEventListener("click", function bcd() {
        document.querySelector(".hp").style.display = "block";
      });
    </script>
  </body>
</html>
